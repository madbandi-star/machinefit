# Reference for manual Web Service setup (Blueprint may require paid/card).
# Create via Render Dashboard: New → Web Service (not Blueprint).
#
# CRITICAL — Build Command must be EXACTLY:
#   npm run build:render
# Do not prefix with `npm ci` / `npm install` (that duplicates work; old
# monorepo installs also OOMed when frontend was a workspace).
#
# 1k concurrent readiness (ops — apply in Render Dashboard, not Blueprint free):
# - Plan: Standard or Pro (Starter 0.5CPU/512MB is insufficient for 1k)
# - Instances: 2–4 with autoscale on CPU ≥70%
# - Health Check Path: /api/v1/health (liveness — always 200 while process up)
# - Optional readiness (do NOT use as Render healthCheckPath): /ready or /api/v1/ready
# - Always On / no idle spin-down on paid plans
# - Region: closest to Supabase (ap-northeast-2 / Singapore as available)
# - Env: DATABASE_URL → Supabase Transaction pooler :6543?pgbouncer=true
#        DATABASE_POOL_MAX=10 (per instance; avoid session pooler)
#        OPS_API_SAMPLE_RATE=0.05
#        REQUEST_TIMEOUT_MS=30000
#        SHUTDOWN_GRACE_MS=15000
#        DR_ALERT_WEBHOOK_URL= (optional Slack/Discord webhook)
#        MF_DEPLOY_ENV=PROD|STAGE|DEV
services:
  - type: web
    name: machinefit-api
    plan: free
    runtime: node
    buildCommand: npm run build:render
    startCommand: npm run start --workspace=backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: NODE_ENV
        value: production
      - key: PORT
        sync: false
      - key: API_BASE_PATH
        value: /api/v1
      - key: SKIP_FRONTEND_INSTALL
        value: '1'
      - key: DATABASE_URL
        sync: false
      # Optional pool / ops tuning for higher concurrency (defaults in code):
      # DATABASE_POOL_MAX=10
      # OPS_API_SAMPLE_RATE=0.05
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: https://madbandi-star.github.io
      - key: GOOGLE_CLIENT_ID
        value: 600013402579-oc4q1psgohjpk3ab3enc10ohb110clmg.apps.googleusercontent.com
      # Set in Render Dashboard (do not commit the real secret here):
      # KAKAO_REST_API_KEY=<from Kakao Developers REST API key>
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
