    <script>
      (function () {
        /* Mobile: lock layout viewport to iPhone 15 Pro Max CSS width so media queries + flex match */
        try {
          var ua = navigator.userAgent || '';
          var isMobile =
            /Android|iPhone|iPad|iPod/i.test(ua) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
          if (isMobile) {
            var vp = document.querySelector('meta[name="viewport"]');
            if (vp) {
              vp.setAttribute('content', 'width=430, initial-scale=1, viewport-fit=cover');
            }
          }
        } catch (e) {}
        /* PWA cache bust lives in main.tsx (one-shot + sets a key).
           Do NOT unregister SW here — clearing without setting a key races
           autoUpdate registerSW and causes infinite location.reload() in Chrome. */
      })();
