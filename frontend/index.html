    <style id="mf-app-frame-v14">
      /* iPhone 15 Pro Max frame + dark paint before CSS bundle (avoids white/navy FOUC) */
      :root {
        --app-frame-width: 430px;
      }
      html,
      body {
        margin: 0;
        background: #000;
        color-scheme: dark;
      }
      #root {
        width: 100%;
        max-width: 430px;
        margin-inline: auto;
        min-height: 100dvh;
        background: #000;
      }
      .recommendation-settings-panel--result .recommendation-settings-panel__grid--dense {
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
      }
    </style>
    <script>
      (function () {
        /* Mobile: lock layout viewport to iPhone 15 Pro Max CSS width so media queries + flex match */
        try {
          var ua = navigator.userAgent || '';
          var isMobile =
            /Android|iPhone|iPad|iPod/i.test(ua) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
          if (isMobile) {
            var vp = document.querySelector('meta[name="viewport"]');
            if (vp) {
              vp.setAttribute('content', 'width=430, initial-scale=1, viewport-fit=cover');
            }
          }
        } catch (e) {}
        /* PWA cache bust lives in main.tsx (one-shot + sets a key).
           Do NOT unregister SW here — clearing without setting a key races
           autoUpdate registerSW and causes infinite location.reload() in Chrome. */
      })();
    </script>
