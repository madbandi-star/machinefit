name: CI

# Run only on PRs to avoid stacking with Deploy Frontend on every main push.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install shared/backend workspaces
        run: npm ci
        env:
          SKIP_FRONTEND_INSTALL: '1'

      - run: npm run build --workspace=shared

      - name: Unit tests (shared + backend, no DB)
        run: npm test

      - name: Scan for hardcoded leaked OAuth keys
        run: npm run secrets:scan

      - name: Verify migration file integrity
        run: npm run db:verify:files

      - name: Verify live schema (optional)
        if: ${{ secrets.DATABASE_URL != '' }}
        run: npm run db:verify
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - run: npm run typecheck --workspace=shared
      - run: npm run typecheck --workspace=backend
      - run: npm run typecheck --prefix frontend

      - run: npm run build:frontend
      - run: npm run build:backend
