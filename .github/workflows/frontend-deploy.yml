name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Do not cancel an in-flight Pages deploy — rapid pushes were aborting
# deploy-pages mid-poll (build OK, deploy cancelled → live site stuck).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install shared/backend workspaces
        run: npm ci
        env:
          SKIP_FRONTEND_INSTALL: '1'

      - run: npm run build --workspace=shared

      - name: Install and build frontend
        working-directory: frontend
        run: npm ci
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          # Google OAuth web client id (public; embedded in SPA bundle).
          VITE_GOOGLE_CLIENT_ID: 600013402579-oc4q1psgohjpk3ab3enc10ohb110clmg.apps.googleusercontent.com
          # Kakao JavaScript key (public; embedded in SPA bundle).
          VITE_KAKAO_JS_KEY: ec1d5c905cdad5a5e273e3d78423ca35
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_SENTRY_TRACES_SAMPLE_RATE: '0.05'

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: 600013402579-oc4q1psgohjpk3ab3enc10ohb110clmg.apps.googleusercontent.com
          VITE_KAKAO_JS_KEY: ec1d5c905cdad5a5e273e3d78423ca35
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_SENTRY_TRACES_SAMPLE_RATE: '0.05'
          # Optional source map upload (soft-fail in vite plugin if missing/invalid)
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          GITHUB_SHA: ${{ github.sha }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist

  deploy:
    environment:
      name: github-pages
    needs: build
    runs-on: ubuntu-latest
    # Action itself caps at 10m; allow a few retries for GitHub Pages backend stalls.
    timeout-minutes: 35

    steps:
      # deploy-pages intermittently sticks on deployment_queued / purging_cdn until its
      # 10m hard timeout — retry instead of leaving machine-fit.com on a stale build.
      - name: Deploy to GitHub Pages
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: actions/deploy-pages@v4
          attempt_limit: 3
          attempt_delay: 20000
