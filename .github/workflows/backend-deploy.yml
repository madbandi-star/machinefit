name: Deploy Backend to Render

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'database/**'
      - 'package.json'
      - 'package-lock.json'
      - 'render.yaml'
  workflow_dispatch:

concurrency:
  group: render-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret is not set."
            echo "Manual deploy: Render → machinefit-api → Manual Deploy"
            echo "To enable auto-deploy:"
            echo "  1) Render → machinefit-api → Settings → Deploy Hook → copy URL"
            echo "  2) GitHub → Settings → Secrets → Actions → add RENDER_DEPLOY_HOOK_URL"
            echo "See docs/DEPLOY.md"
            exit 0
          fi
          curl -fsSL -X POST "$DEPLOY_HOOK"
          echo "Render deploy triggered successfully."
