services:
  - type: web
    name: machinefit-api
    runtime: node
    buildCommand: npm run build:render
    startCommand: npm run start --workspace=backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: SKIP_FRONTEND_INSTALL
        value: '1'
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
